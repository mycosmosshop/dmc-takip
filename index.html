<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2f6e">
<title>DMC Mükerrer Kod Takibi — Sanifoam</title>
<style>
  :root{
    --ana:#0f2f6e; --ana2:#1a4a9e; --zemin:#eef1f6; --kart:#fff;
    --kenar:#d8dee8; --metin:#1f2937; --soluk:#6b7280;
    --ok:#177245; --okZemin:#e8f6ee; --hata:#b42318; --hataZemin:#fdeceb;
    --uyari:#8a6320; --uyariZemin:#fff6e5;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--zemin);color:var(--metin);-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,var(--ana),var(--ana2));color:#fff;
         padding:11px 14px;position:sticky;top:0;z-index:10;
         display:flex;align-items:center;justify-content:space-between;gap:8px}
  header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px}
  header .alt{font-size:11.5px;opacity:.85;margin-top:2px}
  #yonetimAc,#sesAc{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
             color:#fff;width:34px;height:34px;border-radius:9px;font-size:15px;flex:0 0 auto}
  #sesAc.kapali{opacity:.45}
  .sar{max-width:640px;margin:0 auto;padding:12px 12px 90px}
  .kart{background:var(--kart);border:1px solid var(--kenar);border-radius:12px;
        padding:12px;margin-bottom:12px}
  label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;
        text-transform:uppercase;color:var(--soluk);margin-bottom:5px}
  select,input[type=text],input[type=password]{width:100%;height:42px;padding:0 10px;
        font-size:16px;border:1px solid var(--kenar);border-radius:9px;
        background:#fff;color:var(--metin)}
  .ikili{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid transparent}
  .bas{width:100%;height:52px;font-size:17px;font-weight:700;color:#fff;
       background:var(--ana);border-color:var(--ana)}
  .bas:disabled{opacity:.5}
  .ikinci{height:42px;padding:0 14px;background:#fff;border-color:var(--kenar);color:var(--metin)}
  .tehlike{background:#fff;border-color:#f0c9c5;color:var(--hata)}
  #video{width:100%;border-radius:10px;background:#000;display:none;aspect-ratio:4/3;object-fit:cover}
  /* Sonuc kutusu icerik degisince buyuyup kamerayi asagi itiyordu.
     Artik HEP gorunur ve SABIT yukseklikte: kamera hic oynamaz. */
  #sonuc{border-radius:11px;padding:8px 10px;margin-bottom:10px;
         border:1px solid var(--kenar);background:var(--kart);
         text-align:center;height:74px;overflow:hidden;
         display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:1px}
  #sonuc .kod{font:700 17px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;
              width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sonuc .dur{font-size:13.5px;font-weight:800;letter-spacing:.02em}
  #sonuc .ek{font-size:11px;opacity:.85;width:100%;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  #sonuc.bos{color:var(--soluk)}
  .ok{background:var(--okZemin);border-color:#b7e0c8;color:var(--ok)}
  .hata{background:var(--hataZemin);border-color:#f4c7c3;color:var(--hata)}
  .bekle{background:var(--uyariZemin);border-color:#f0dcae;color:var(--uyari)}
  .sayac{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
  .sayac div{background:#f7f9fc;border:1px solid var(--kenar);border-radius:10px;padding:8px 4px}
  .sayac b{display:block;font-size:20px;line-height:1.1}
  .sayac span{font-size:10.5px;color:var(--soluk);text-transform:uppercase;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
     color:var(--soluk);padding:4px 6px;border-bottom:1px solid var(--kenar)}
  td{padding:6px;border-bottom:1px solid #eef1f5;vertical-align:top}
  td.k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
  tr.mk td{background:var(--hataZemin)}
  tr.om td{background:var(--uyariZemin)}
  td.sec,th.sec{width:30px;text-align:center;padding:6px 2px}
  input[type=checkbox]{width:19px;height:19px;accent-color:var(--ana)}
  .rozet{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;
         border-radius:999px;background:var(--okZemin);color:var(--ok)}
  .rozet.m{background:#f9d9d6;color:var(--hata)}
  .rozet.o{background:#f6e3b8;color:var(--uyari)}
  .dip{font-size:11.5px;color:var(--soluk);margin-top:6px}
  .durum{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soluk)}
  .nokta{width:8px;height:8px;border-radius:50%;background:#9ca3af}
  .nokta.acik{background:#16a34a}.nokta.kapali{background:#dc2626}
  .satir{display:flex;gap:8px;flex-wrap:wrap}
  .satir button{flex:1 1 auto;min-width:130px}
  .gizli{display:none!important}
  .yonetimKutu{border-left:3px solid var(--hata);background:var(--hataZemin)}
  @media(prefers-color-scheme:dark){
    :root{--zemin:#161a20;--kart:#20252c;--kenar:#333a44;--metin:#e6e9ee;--soluk:#9aa3af;
          --okZemin:#16301f;--hataZemin:#331a19;--uyariZemin:#302713}
    select,input[type=text],input[type=password],.ikinci{background:#20252c;color:var(--metin)}
    .sayac div{background:#1a1f26}
    td{border-bottom-color:#2a3038}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>DMC Mükerrer Kod Takibi</h1>
    <div class="alt">Sanifoam · ortak havuz — her lokasyon aynı listeyi görür</div>
  </div>
  <div style="display:flex;gap:6px;flex:0 0 auto">
    <button id="sesAc" title="Sesli uyarı">🔊</button>
    <button id="yonetimAc" title="Yönetim">⚙</button>
  </div>
</header>

<div class="sar">

  <!-- Sonuc ve kamera EN USTTE: operator etiketi tutarken sonucu ayni
       ekranda gormeli, kaydirmak zorunda kalmamali. -->
  <div id="sonuc" class="bos"><div class="dur">Kod bekleniyor</div><div class="kod"></div><div class="ek">Kamerayı başlatın ya da elle yazın</div></div>

  <div class="kart">
    <button class="ikinci" id="kamera" style="width:100%">📷 Kamerayı başlat</button>
    <video id="video" playsinline muted></video>
    <div class="dip" id="kameraNot"></div>
  </div>

  <div class="kart">
    <label for="elle">Kod</label>
    <input type="text" id="elle" placeholder="Kodu okut ya da elle yaz" autocomplete="off"
           autocapitalize="characters" enterkeyhint="done">
    <div style="height:10px"></div>
    <button class="bas" id="kaydet">Kaydet ve kontrol et</button>
  </div>

  <div class="kart">
    <div class="ikili">
      <div>
        <label for="lok">Lokasyon</label>
        <select id="lok">
          <option>Çerkezköy</option>
          <option>Ankara</option>
          <option>Sakarya</option>
          <option>Almanya</option>
          <option>Eskişehir</option>
          <option>Müşteri</option>
          <option>Diğer</option>
        </select>
      </div>
      <div>
        <label for="kisi">Okuyan</label>
        <input type="text" id="kisi" placeholder="ad soyad" autocomplete="name">
      </div>
    </div>
  </div>

  <div class="kart">
    <div class="sayac">
      <div><b id="sT">0</b><span>toplam</span></div>
      <div><b id="sY">0</b><span>yeni</span></div>
      <div><b id="sM">0</b><span>mükerrer</span></div>
      <div><b id="sO">0</b><span>okunamadı</span></div>
    </div>
    <div style="height:10px"></div>
    <div class="durum"><span class="nokta" id="nokta"></span><span id="durumYazi">bağlanıyor…</span></div>
  </div>

  <div class="kart">
    <label>Kayıtlar</label>
    <table>
      <thead><tr>
        <th class="sec"><input type="checkbox" id="hepsiSec" title="Tümünü seç"></th>
        <th>Kod</th><th>Yer</th><th>Saat</th>
      </tr></thead>
      <tbody id="liste"><tr><td colspan="4" style="color:var(--soluk)">—</td></tr></tbody>
    </table>
    <div style="height:10px"></div>
    <div class="satir">
      <button class="ikinci" id="yenile">↻ Yenile</button>
      <button class="ikinci" id="excel">⬇ Excel'e aktar</button>
      <button class="ikinci" id="paylas">↗ Paylaş</button>
    </div>
    <div style="height:8px"></div>
    <button class="ikinci tehlike gizli" id="secSil" style="width:100%">
      🗑 Seçilenleri sil (<span id="secSay">0</span>)</button>
    <div class="dip" id="listeNot"></div>
  </div>

  <!-- Yonetim: kazara silmeyi onlemek icin gizli. Gercek yetkilendirme
       DEGIL — anon anahtar herkeste; RLS delete politikasi acik oldugu
       surece teknik olarak herkes silebilir. -->
  <div class="kart yonetimKutu gizli" id="yonetimKutu">
    <label>Yönetim</label>
    <div class="dip" style="margin:0 0 8px">
      Deneme kayıtlarını temizlemek için. Geri alınamaz.
    </div>
    <div class="satir">
      <button class="ikinci tehlike" id="tumSil">⚠ Tüm kayıtları sıfırla</button>
      <button class="ikinci" id="yonetimKapat">Kapat</button>
    </div>
  </div>

</div>

<script>
/* ── Ortak havuz: Supabase REST. anon anahtar tarayiciya gomulmek uzere
      tasarlanmistir; gizli olan service_role'dur ve buraya KONMAZ. ── */
const SB_URL = 'https://donjfzetqpzrgforhenu.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvbmpmemV0cXB6cmdmb3JoZW51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MzMyNTMsImV4cCI6MjA5OTUwOTI1M30.qKwUeImRijR9V7TUoXYAfGxJpMF2hocZzXFK8ph189I';
const TABLO = 'dmc_okuma';
/* Okunamayan etiketin kodu yok; sabit bir isaret kaydediliyor. Bu kod
   HAVUZA GIRMEZ (yoksa ikinci okunamayan "mukerrer" gorunur). */
const OKUNAMADI_KOD = '(okunamadı)';
const YONETIM_PIN = '1907';          /* kazara silmeye karsi; sir degil */
const BASLIK = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
                 'Content-Type': 'application/json' };

const $ = (s) => document.querySelector(s);
const sonuc = $('#sonuc');
let sayac = { t: 0, y: 0, m: 0, o: 0 };
let sonListe = [];
let toplamKayit = null;
/* Bilinen kodlar: karar bundan verilir, ag beklenmez. Sunucu son sozu
   soyler ama ekran once dolar. */
const bilinen = new Set();
let havuzHazir = false;

try {
  $('#lok').value = localStorage.getItem('dmc_lok') || 'Çerkezköy';
  $('#kisi').value = localStorage.getItem('dmc_kisi') || '';
} catch (e) {}
$('#lok').onchange = () => { try { localStorage.setItem('dmc_lok', $('#lok').value); } catch (e) {} };
$('#kisi').onchange = () => { try { localStorage.setItem('dmc_kisi', $('#kisi').value.trim()); } catch (e) {} };

/* Yalniz 'kod' sutunu cekilir: 10 bin kayit ~150 KB, aciliste bir kez. */
async function havuzYukle(temizle) {
  try {
    let bas = 0;
    const adim = 1000;
    const yeni = new Set();
    for (; bas < 200000; bas += adim) {
      const r = await fetch(SB_URL + '/rest/v1/' + TABLO
        + '?select=kod&mukerrer=is.false&offset=' + bas + '&limit=' + adim,
        { headers: BASLIK });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const p = await r.json();
      // Okunamadi isareti gercek bir kod degil: havuza girerse ikinci
      // okunamayan etiket "mukerrer" sayilir.
      p.forEach((s) => { if (s.kod !== OKUNAMADI_KOD) yeni.add(String(s.kod)); });
      if (p.length < adim) break;
    }
    // CLEAR ETME: yukleme surerken okunan kodlar havuzdan dusuyordu ve
    // bir sonraki okumada "yeni" gorunuyordu. Ekleyerek birlestirilir;
    // yalniz silme sonrasi (temizle=true) tam tazeleme yapilir.
    if (temizle) bilinen.clear();
    yeni.forEach((k) => bilinen.add(k));
    havuzHazir = true;
    return true;
  } catch (e) {
    havuzHazir = false;
    return false;
  }
}

function durum(acik, yazi) {
  $('#nokta').className = 'nokta ' + (acik ? 'acik' : 'kapali');
  $('#durumYazi').textContent = yazi;
}

/* ── Sesli uyari ───────────────────────────────────────────────────
   Tarayici, kullanici sayfaya DOKUNMADAN ses calmiyor: kamera otomatik
   okudugunda AudioContext 'suspended' kalip sessiz gecistiriyordu. Her
   dokunusta uyandirilir. Mukerrer: uc kez alcak bip + Turkce anons +
   uzun titresim — gurultulu sahada bip tek basina yetmiyor. */
let sesBaglam = null;
let sesAcik = true;
try { sesAcik = localStorage.getItem('dmc_ses') !== '0'; } catch (e) {}

function sesUyandir() {
  try {
    sesBaglam = sesBaglam || new (window.AudioContext || window.webkitAudioContext)();
    if (sesBaglam.state === 'suspended') sesBaglam.resume();
  } catch (e) {}
}
document.addEventListener('pointerdown', sesUyandir);
document.addEventListener('keydown', sesUyandir);

function tonCal(hz, sure, gecikme, ses) {
  try {
    sesUyandir();
    if (!sesBaglam) return;
    const t0 = sesBaglam.currentTime + gecikme;
    const o = sesBaglam.createOscillator(), g = sesBaglam.createGain();
    o.type = 'square';                      // kare dalga sahada daha delici
    o.connect(g); g.connect(sesBaglam.destination);
    o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(ses, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + sure);
    o.start(t0); o.stop(t0 + sure + 0.02);
  } catch (e) {}
}

/* lang='tr-TR' TEK BASINA YETMIYOR: cihazin varsayilan sesi Ingilizce ise
   Turkce metni Ingilizce telaffuzla okuyor. Turkce sesi acikca seciyoruz.
   getVoices() ilk cagride BOS donebilir — liste gelince tekrar araniyor. */
let trSes = null;
function trSesAra() {
  try {
    const l = speechSynthesis.getVoices() || [];
    trSes = l.filter((v) => /^tr(-|_|$)/i.test(v.lang || ''))[0] || null;
  } catch (e) {}
}
try {
  trSesAra();
  speechSynthesis.addEventListener('voiceschanged', trSesAra);
} catch (e) {}

function anons(metin) {
  try {
    if (!sesAcik || !('speechSynthesis' in window)) return;
    if (!trSes) trSesAra();
    // Liste dolu ama Turkce ses yoksa: Ingilizce telaffuz etmesin. Bip
    // zaten caldigi icin uyari kaybolmuyor.
    if (!trSes && (speechSynthesis.getVoices() || []).length) return;
    const u = new SpeechSynthesisUtterance(metin);
    if (trSes) u.voice = trSes;
    u.lang = 'tr-TR'; u.rate = 1.05; u.pitch = 1; u.volume = 1;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* AudioContext bazi cihazlarda (sessiz anahtar, bazi Android surumleri)
   hic ses vermiyordu. Yedek yol: WAV data URI'li <audio>. Ikisi birden
   denenir; hangisi calarsa calar. */
function wavCal(hz, sure, ses) {
  try {
    const oran = 8000, adet = Math.floor(oran * sure);
    const veri = new Uint8Array(44 + adet * 2);
    const dv = new DataView(veri.buffer);
    const yaz = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    yaz(0, 'RIFF'); dv.setUint32(4, 36 + adet * 2, true); yaz(8, 'WAVEfmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, oran, true); dv.setUint32(28, oran * 2, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    yaz(36, 'data'); dv.setUint32(40, adet * 2, true);
    for (let i = 0; i < adet; i++) {
      const s = Math.sin(2 * Math.PI * hz * i / oran) > 0 ? 1 : -1;   // kare dalga
      dv.setInt16(44 + i * 2, s * 32767 * ses, true);
    }
    let ikili = '';
    for (let i = 0; i < veri.length; i++) ikili += String.fromCharCode(veri[i]);
    const a = new Audio('data:audio/wav;base64,' + btoa(ikili));
    a.volume = 1;
    a.play().catch(() => {});
  } catch (e) {}
}

/* Mukerrer sesinden AYRI olmali: inen ikili ton = "olmadi". */
function bipOkunamadi() {
  if (!sesAcik) return;
  tonCal(520, 0.16, 0.00, 0.6);
  tonCal(390, 0.24, 0.20, 0.6);
  wavCal(430, 0.42, 0.6);
  setTimeout(() => anons('Okunamadı'), 620);
}

function bip(mukerrer) {
  if (sesAcik) {
    if (mukerrer) {
      tonCal(300, 0.30, 0.00, 0.85);
      tonCal(300, 0.30, 0.36, 0.85);
      tonCal(220, 0.65, 0.72, 0.9);
      wavCal(300, 1.35, 0.85);                    // yedek yol
      setTimeout(() => anons('Mükerrer kod'), 1450);
    } else {
      tonCal(1050, 0.14, 0, 0.55);
      wavCal(1050, 0.14, 0.5);
    }
  }
  try {
    navigator.vibrate && navigator.vibrate(
      mukerrer ? [220, 90, 220, 90, 420] : 60);
  } catch (e) {}
}

function goster(tur, dur, kod, ek) {
  sonuc.className = tur;
  sonuc.querySelector('.dur').textContent = dur;
  sonuc.querySelector('.kod').textContent = kod || '';
  sonuc.querySelector('.ek').textContent = ek || '';
}

function saat(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
      + ' · ' + d.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' });
  } catch (e) { return ''; }
}

/* ── Kayit: once AYNI kod var mi diye sorulur, sonra yazilir. Kod sutunu
      bilerek unique DEGIL: mukerrer deneme de kayda girsin ki kimin
      nerede ne zaman ikinci kez okuttugu iz biraksin. ── */
/* Kod gorulur gorulmez sonuc verilir: karar YEREL havuzdan, ag arkada.
   Sunucu farkli soylerse ekran duzeltilir ve uyari yeniden calar. */
let sonKayitKod = '', sonKayitAn = 0;
function kaydet(kod) {
  kod = String(kod || '').trim().toUpperCase();
  if (!kod) return;
  // Son emniyet: ayni kod 1.2 sn icinde iki kez gelirse (kamera titremesi,
  // cift dokunus, Enter tekrari) tek sayilir. Kamera kilidi asilsa bile
  // havuza cift satir girmez.
  const su = Date.now();
  if (kod === sonKayitKod && su - sonKayitAn < 1200) return;
  sonKayitKod = kod; sonKayitAn = su;
  const lok = $('#lok').value, kisi = $('#kisi').value.trim();

  // ── ANINDA karar (0 ms) ──
  const mukerrer = bilinen.has(kod);
  if (!mukerrer) bilinen.add(kod);
  sayac.t++; mukerrer ? sayac.m++ : sayac.y++;
  $('#sT').textContent = sayac.t; $('#sY').textContent = sayac.y;
  $('#sM').textContent = sayac.m;
  if (mukerrer) {
    goster('hata', '⛔ MÜKERRER', kod,
      havuzHazir ? 'Bu kod havuzda kayıtlı' : 'Havuz yükleniyordu — doğrulanıyor');
  } else {
    goster('ok', '✓ YENİ KOD', kod, lok + (kisi ? ' · ' + kisi : ''));
  }
  bip(mukerrer);
  $('#elle').value = '';

  // ── Ag ARKADA: yaz, sonra gercek durumu dogrula ──
  arkaPlan(kod, lok, kisi, mukerrer);
}

/* Okunamayan etiket kaydi. kaydet() KULLANILMAZ: kod sabit oldugu icin
   havuz ve dogrulama sorgusu bunu mukerrer sanardi. Tek atislik yazma. */
async function okunamadiKaydet() {
  sayac.o++;
  $('#sO').textContent = sayac.o;
  const lok = $('#lok').value, kisi = $('#kisi').value.trim();
  try {
    const r = await fetch(SB_URL + '/rest/v1/' + TABLO, {
      method: 'POST', headers: BASLIK,
      body: JSON.stringify({ kod: OKUNAMADI_KOD, lokasyon: lok,
                             okuyan: kisi || null, mukerrer: false })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    listele();
  } catch (e) {
    // Sessizce yutma: operator uyariyi gordu ama kayit yok olabilir.
    durum(false, 'okunamadı kaydı yazılamadı: ' + String(e.message || e).slice(0, 50));
  }
}

async function arkaPlan(kod, lok, kisi, mukerrerTahmin) {
  // Yazma once: kayit kaybolmasin. Dogrulama sonra.
  try {
    const r = await fetch(SB_URL + '/rest/v1/' + TABLO, {
      method: 'POST', headers: BASLIK,
      body: JSON.stringify({ kod: kod, lokasyon: lok, okuyan: kisi || null,
                             mukerrer: mukerrerTahmin })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 100));
    durum(true, 'bağlı');
  } catch (e) {
    // Sessizce yutma: operator "yeni" gordu ama kayit yok olabilir.
    durum(false, 'KAYIT YAZILAMADI: ' + String(e.message || e).slice(0, 60));
    goster('hata', '⚠ KAYDEDİLEMEDİ', kod, 'Bağlantıyı kontrol edip tekrar okutun');
    bip(true);
    bilinen.delete(kod);            // yazilamadi, bilinen sayilmasin
    return;
  }

  // Gercek durum: bu koddan KAC "yeni" kayit var?
  try {
    const r2 = await fetch(SB_URL + '/rest/v1/' + TABLO
      + '?select=lokasyon,okuyan,zaman&kod=eq.' + encodeURIComponent(kod)
      + '&mukerrer=is.false&order=zaman.asc&limit=2', { headers: BASLIK });
    if (!r2.ok) return;
    const v = await r2.json();
    // Yerel havuz eskiyse (baska telefon once okutmus) burada anlasilir.
    const gercekMukerrer = v.length > 1 || (v.length === 1 && mukerrerTahmin);
    if (!mukerrerTahmin && v.length > 1) {
      const ilk = v[0];
      goster('hata', '⛔ MÜKERRER (sunucu)', kod,
        'İlk okuma: ' + (ilk.lokasyon || '—') + (ilk.okuyan ? ' · ' + ilk.okuyan : '')
        + ' · ' + saat(ilk.zaman));
      bip(true);
      sayac.y--; sayac.m++;
      $('#sY').textContent = sayac.y; $('#sM').textContent = sayac.m;
    } else if (mukerrerTahmin && v.length === 1) {
      // Yerelde mukerrer sandik, sunucuda ilk okuma bilgisi var: detayi yaz
      const ilk = v[0];
      goster('hata', '⛔ MÜKERRER', kod,
        'İlk okuma: ' + (ilk.lokasyon || '—') + (ilk.okuyan ? ' · ' + ilk.okuyan : '')
        + ' · ' + saat(ilk.zaman));
    }
    void gercekMukerrer;
  } catch (e) { /* dogrulama basarisiz: ekran yerel karari gosterir */ }
  listele();
}

/* ── Liste ── */
async function listele() {
  try {
    const r = await fetch(SB_URL + '/rest/v1/' + TABLO
      + '?select=id,kod,lokasyon,okuyan,mukerrer,zaman&order=zaman.desc&limit=300',
      { headers: BASLIK });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    sonListe = await r.json();
    // Toplam sayi: govde cekilmeden yalniz basliktan okunur (ucuz)
    try {
      const s = await fetch(SB_URL + '/rest/v1/' + TABLO + '?select=id&limit=1',
        { headers: Object.assign({ Prefer: 'count=exact' }, BASLIK) });
      const cr = s.headers.get('content-range');
      if (cr && cr.indexOf('/') > 0) toplamKayit = cr.split('/')[1];
    } catch (e) {}
    durum(true, 'bağlı · son ' + sonListe.length + ' kayıt gösteriliyor'
      + (toplamKayit !== null ? ' · havuzda toplam ' + toplamKayit : ''));
    $('#liste').innerHTML = sonListe.length ? sonListe.map(function (s) {
      const okMaz = s.kod === OKUNAMADI_KOD;
      return '<tr class="' + (okMaz ? 'om' : s.mukerrer ? 'mk' : '') + '">'
        + '<td class="sec"><input type="checkbox" class="sc" data-id="' + s.id + '"></td>'
        + '<td class="k">' + s.kod
        + (okMaz ? ' <span class="rozet o">OKUNAMADI</span>'
                 : s.mukerrer ? ' <span class="rozet m">MÜK</span>'
                              : ' <span class="rozet">yeni</span>')
        + '</td><td>' + (s.lokasyon || '—')
        + (s.okuyan ? '<br><span style="color:var(--soluk);font-size:11px">' + s.okuyan + '</span>' : '')
        + '</td><td style="white-space:nowrap">' + saat(s.zaman) + '</td></tr>';
    }).join('') : '<tr><td colspan="4" style="color:var(--soluk)">Henüz kayıt yok</td></tr>';
    secGuncelle();
  } catch (e) {
    durum(false, 'liste alınamadı: ' + String(e.message || e).slice(0, 60));
  }
}

function secililer() {
  return Array.prototype.slice.call(document.querySelectorAll('.sc:checked'))
    .map((c) => c.dataset.id);
}
function secGuncelle() {
  const n = secililer().length;
  $('#secSay').textContent = n;
  $('#secSil').classList.toggle('gizli', n === 0);
}
document.addEventListener('change', (e) => {
  if (e.target.classList && e.target.classList.contains('sc')) secGuncelle();
});
$('#hepsiSec').onchange = function () {
  document.querySelectorAll('.sc').forEach((c) => { c.checked = this.checked; });
  secGuncelle();
};

/* ── Excel: CSV (BOM + noktali virgul) — Turkce Excel dogrudan acar ──
   Ekrandaki liste son 300 kayitla sinirli; disa aktarim TUM havuzu ceker,
   yoksa kayit buyudukce eski kayitlar aktarilmadan kalirdi. */
async function tumKayitlar() {
  const hepsi = [];
  const adim = 1000;
  for (let bas = 0; bas < 100000; bas += adim) {
    const r = await fetch(SB_URL + '/rest/v1/' + TABLO
      + '?select=kod,lokasyon,okuyan,mukerrer,zaman&order=zaman.desc'
      + '&offset=' + bas + '&limit=' + adim, { headers: BASLIK });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const p = await r.json();
    hepsi.push.apply(hepsi, p);
    if (p.length < adim) break;
  }
  return hepsi;
}

function csvUret(kayitlar) {
  const bas = ['Kod', 'Durum', 'Lokasyon', 'Okuyan', 'Tarih', 'Saat'];
  const satir = kayitlar.map(function (s) {
    const d = new Date(s.zaman);
    return [s.kod, s.mukerrer ? 'MÜKERRER' : 'yeni', s.lokasyon || '', s.okuyan || '',
            d.toLocaleDateString('tr-TR'), d.toLocaleTimeString('tr-TR')]
      .map((h) => '"' + String(h).replace(/"/g, '""') + '"').join(';');
  });
  // Excel'in Turkce surumu BOM'a ragmen ayraci bazen virgul sanip tum
  // satiri tek hucreye basiyor ve kodlamayi da kaciriyordu. sep=; ilk
  // satirda ayraci ACIKCA bildirir; CRLF de Excel'in bekledigi satir sonu.
  const SS = '\r\n';
  return '﻿' + 'sep=;' + SS + bas.join(';') + SS
    + satir.join(SS) + SS;
}
function dosyaAdi(n) {
  const d = new Date();
  return 'DMC_' + d.toISOString().slice(0, 10) + '_' + n + 'kayit.csv';
}
/* CSV renk tasiyamaz. Excel'in actigi HTML tablosu tasir: mukerrer
   satirlar kirmizi zeminli gelir, Turkce meta charset ile gecer, ayrac
   sorunu da olmaz. */
function xlsUret(kayitlar) {
  const esc = (h) => String(h == null ? '' : h)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const satir = kayitlar.map(function (s) {
    const d = new Date(s.zaman);
    const okMaz = s.kod === OKUNAMADI_KOD;
    const zem = okMaz
      ? ' style="background:#fdf3d8;color:#8a6100;font-weight:bold"'
      : s.mukerrer ? ' style="background:#fdecea;color:#b42318;font-weight:bold"' : '';
    return '<tr' + zem + '>'
      + '<td style="mso-number-format:\\@">' + esc(s.kod) + '</td>'
      + '<td>' + (okMaz ? 'OKUNAMADI' : s.mukerrer ? 'MÜKERRER' : 'yeni') + '</td>'
      + '<td>' + esc(s.lokasyon) + '</td>'
      + '<td>' + esc(s.okuyan) + '</td>'
      + '<td>' + d.toLocaleDateString('tr-TR') + '</td>'
      + '<td>' + d.toLocaleTimeString('tr-TR') + '</td></tr>';
  }).join('');
  const mk = kayitlar.filter((s) => s.mukerrer).length;
  const om = kayitlar.filter((s) => s.kod === OKUNAMADI_KOD).length;
  return '<html xmlns:x="urn:schemas-microsoft-com:office:excel">'
    + '<head><meta charset="utf-8">'
    + '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>'
    + '<x:ExcelWorksheet><x:Name>DMC</x:Name><x:WorksheetOptions>'
    + '<x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>'
    + '</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'
    + '</head><body>'
    + '<table border="1" cellspacing="0" style="border-collapse:collapse;font:11pt Calibri">'
    + '<tr style="background:#0f2f6e;color:#fff;font-weight:bold">'
    + '<th>Kod</th><th>Durum</th><th>Lokasyon</th><th>Okuyan</th>'
    + '<th>Tarih</th><th>Saat</th></tr>'
    + satir + '</table>'
    + '<p style="font:9pt Calibri;color:#666">Toplam ' + kayitlar.length
    + ' kayıt · ' + mk + ' mükerrer · ' + om + ' okunamadı · Sanifoam DMC takip</p>'
    + '</body></html>';
}

$('#excel').onclick = async function () {
  $('#listeNot').textContent = 'Tüm kayıtlar toplanıyor…';
  let k;
  try { k = await tumKayitlar(); }
  catch (e) { $('#listeNot').textContent = 'Aktarılamadı: ' + String(e.message || e); return; }
  if (!k.length) { $('#listeNot').textContent = 'Aktarılacak kayıt yok.'; return; }
  const b = new Blob([xlsUret(k)], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = dosyaAdi(k.length).replace(/\.csv$/, '.xls');
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  $('#listeNot').textContent = k.length + ' kayıt indirildi: ' + a.download;
};
/* Paylas: telefondan PC'ye gecirmenin en kisa yolu (WhatsApp/mail) */
$('#paylas').onclick = async function () {
  $('#listeNot').textContent = 'Tüm kayıtlar toplanıyor…';
  let k;
  try { k = await tumKayitlar(); }
  catch (e) { $('#listeNot').textContent = 'Alınamadı: ' + String(e.message || e); return; }
  if (!k.length) { $('#listeNot').textContent = 'Paylaşılacak kayıt yok.'; return; }
  const dosya = new File([csvUret(k)], dosyaAdi(k.length), { type: 'text/csv' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [dosya] })) {
      await navigator.share({ files: [dosya], title: 'DMC kayıtları' });
      $('#listeNot').textContent = 'Paylaşıldı.';
    } else {
      $('#listeNot').textContent = 'Bu tarayıcı dosya paylaşamıyor — "Excel\'e aktar" ile indirin.';
    }
  } catch (e) { /* kullanici vazgecti */ }
};

    const r = await fetch(SB_URL + '/rest/v1/' + TABLO + '?' + kosul,
      { method: 'DELETE', headers: Object.assign({ Prefer: 'return=representation' }, BASLIK) });
    if (!r.ok) {
      const g = (await r.text()).slice(0, 160);
      throw new Error('HTTP ' + r.status + ' ' + g);
    }
    const silinen = await r.json();
    $('#listeNot').textContent = etiket + ': ' + silinen.length + ' kayıt silindi.';
    sayac = { t: 0, y: 0, m: 0, o: 0 };
    $('#sT').textContent = 0; $('#sY').textContent = 0; $('#sM').textContent = 0;
    $('#sO').textContent = 0;
    $('#hepsiSec').checked = false;
    sonuc.className = 'bos';

      + (/42501|permission|policy/i.test(m)
         ? '  → Supabase\'de DELETE politikası tanımlı değil (dmc_sil).' : '');
  }
}

/* ── Kamera: BarcodeDetector (Android Chrome). iOS Safari Data Matrix
      cozemiyor; o durumda elle giris devrede kalir. ── */
let akis = null, tarayici = null, sonKod = '', ayniUyari = 0;

/* Etiket tutuluyor ama COZULEMIYOR mu?  BarcodeDetector cozemedigini
   bos dizi olarak donduruyor; "etiket yok" ile "etiket okunamiyor" ayni
   gorunuyor. Ayrimi kareye BAKARAK yapiyoruz.

   Duz kontrast (varyans) YETMEDI: masa dokusu, zemin, golge ve dusuk isik
   gurultusu de kontrast uretiyor, kamera bosa bakarken uyari calmaya
   basliyordu. Simdi IKI kosul birden araniyor:
     1) KESKIN GECIS — DMC hucreleri birkac pikselde bir siyah-beyaz
        atlar; masa/duvar yumusak gecislidir.
     2) IKI UCLU DAGILIM — etikette hem koyu hem acik piksel BOL olur;
        beyaz kagit ya da golgeli masa tek uca yigilir ve gecemez.

   Sahada ayar: uyari bos yere cikiyorsa GECIS_ORAN / UC_ORAN buyutulur,
   gercekten okunamayan etikette hic cikmiyorsa kucultulur. */
const GECIS_ESIK = 45;         // komsu piksel parlaklik farki
const GECIS_ORAN = 0.09;       // kirpilan alanda keskin gecis orani
const UC_ORAN = 0.12;          // koyu VE acik piksellerin her biri en az
const OKUNAMADI_KARE = 28;     // ~4.5 sn (160 ms x 28)
const OKUNAMADI_ARA = 60;      // uyari sonrasi ~10 sn sessizlik
const OKUMA_SONRASI = 25;      // BASARILI okumadan sonra ~4 sn sessizlik
let okunamadiSayac = 0, okunamadiBekle = 0, olcuKare = null;
let sonOlcum = '';             // esik ayari icin: son olculen degerler

function icerikVar(v) {
  try {
    const G = 160, Y = 120;
    if (!olcuKare) {
      olcuKare = document.createElement('canvas');
      olcuKare.width = G; olcuKare.height = Y;
    }
    const gw = v.videoWidth || 0, gh = v.videoHeight || 0;
    if (!gw || !gh) return false;
    const c = olcuKare.getContext('2d', { willReadFrequently: true });
    // Merkezden kirp: etiket cerceveye ortalanir, kenardaki masa olcumu
    // seyreltmesin — ve kucultme orani dustugu icin hucreler kaybolmasin.
    const kw = gw * 0.5, kh = gh * 0.5;
    c.drawImage(v, (gw - kw) / 2, (gh - kh) / 2, kw, kh, 0, 0, G, Y);
    const p = c.getImageData(0, 0, G, Y).data;
    let keskin = 0, gecis = 0, koyu = 0, acik = 0;
    for (let y = 0; y < Y; y++) {
      let onceki = -1;
      for (let x = 0; x < G; x++) {
        const i = (y * G + x) * 4;
        const g = (p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000;
        if (g < 80) koyu++; else if (g > 175) acik++;
        if (onceki >= 0) {
          gecis++;
          if (Math.abs(g - onceki) > GECIS_ESIK) keskin++;
        }
        onceki = g;
      }
    }
    if (!gecis) return false;
    // Her IKI uc de dolu olmali: tek uca yigilan sahne etiket degildir.
    const uc = Math.min(koyu, acik) / (G * Y);
    const gr = keskin / gecis;
    sonOlcum = 'g:' + gr.toFixed(2) + ' u:' + uc.toFixed(2);
    return gr > GECIS_ORAN && uc > UC_ORAN;
  } catch (e) { return false; }   // olcemezsek UYARMA: bos yere calmasin
}
$('#kamera').onclick = async function () {
  if (akis) {
    akis.getTracks().forEach((t) => t.stop());
    akis = null; $('#video').style.display = 'none';
    this.textContent = '📷 Kamerayı başlat';
    return;
  }
  if (!('BarcodeDetector' in window)) {
    $('#kameraNot').textContent =
      'Bu tarayıcı kamerayla kod çözemiyor (iPhone/Safari). Kodu elle yazın ya da el terminali kullanın.';
    return;
  }
  try {
    const turler = await BarcodeDetector.getSupportedFormats();
    const istenen = ['data_matrix', 'qr_code', 'code_128', 'code_39'].filter((t) => turler.includes(t));
    tarayici = new BarcodeDetector({ formats: istenen.length ? istenen : turler });
    akis = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } } });
    const v = $('#video');
    v.srcObject = akis; v.style.display = 'block'; await v.play();
    this.textContent = '⏹ Kamerayı durdur';
    sonKod = ''; ayniUyari = 0;     // yeniden baslatma kilidi sifirlar
    okunamadiSayac = 0; okunamadiBekle = 0;
    $('#kameraNot').textContent = 'Etiketi çerçeveye tutun · çözülen: ' + istenen.join(', ');
    tara();
  } catch (e) {
    $('#kameraNot').textContent = 'Kamera açılamadı: ' + String(e.message || e).slice(0, 80);
  }
};

async function tara() {
  if (!akis || !tarayici) return;
  try {
    const bulunan = await tarayici.detect($('#video'));
    if (!bulunan.length) {
      // Kod cozulemedi. Kameraya bir sey tutuluyorsa sayac isler; bos
      // sahnede islemez ki operator sirada beklerken bosuna calmasin.
      if (okunamadiBekle > 0) okunamadiBekle--;
      else if (!icerikVar($('#video'))) okunamadiSayac = 0;
      else if (++okunamadiSayac >= OKUNAMADI_KARE) {
        okunamadiSayac = 0; okunamadiBekle = OKUNAMADI_ARA;
        goster('bekle', '⚠ OKUNAMADI', '',
          'Silik/karalı/eksik ya da yamuk olabilir — yaklaştırıp düz tutun');
        bipOkunamadi();
        okunamadiKaydet();          // listede ve Excel'de iz biraksin
        $('#kameraNot').textContent =
          'Okunamadı — açıyı değiştirin, ışığı artırın ya da elle yazın.'
          + (sonOlcum ? '  [' + sonOlcum + ']' : '');
      }
    } else {
      // Okumadan SONRA da uyari caliyordu: operator parcayi cekerken
      // kamera masayi/eli goruyor, sayac isliyor ve "YENI KOD" yazisi
      // "OKUNAMADI" ile eziliyordu. Basarili okuma kisa bir sessizlik
      // penceresi aciyor.
      okunamadiSayac = 0; okunamadiBekle = OKUMA_SONRASI;
      const kod = String(bulunan[0].rawValue || '').trim();
      // Kilit YALNIZCA farkli bir kod gorulunce acilir. Ayni etiket
      // kamerada ne kadar kalirsa kalsin, cekilip tekrar gosterilse bile
      // TEK KEZ islenir — sahada her etiket bir kez sayilir.
      if (kod && kod !== sonKod) {
        sonKod = kod;
        ayniUyari = 0;
        $('#kameraNot').textContent = 'Okundu: ' + kod.slice(0, 28)
          + (kod.length > 28 ? '…' : '');
        kaydet(kod);
      } else if (kod && kod === sonKod && ++ayniUyari === 12) {
        // ~2 sn ayni etiket: operator "okumadi mi?" diye beklemesin
        $('#kameraNot').textContent =
          'Bu etiket okundu — sıradaki etiketi gösterin.';
      }
    }
  } catch (e) {}
  if (akis) setTimeout(tara, 160);   // gorur gormez islesin
}
